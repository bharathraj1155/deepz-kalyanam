<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="description" content="You are invited to our wedding.">
<meta name="theme-color" content="#3a1d4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">

<script>
/* ============================================================
   EDIT YOUR WEDDING DETAILS HERE — nothing else needs changing
   ============================================================ */
const WEDDING = {
  groom: "Vijay",
  groomTitle: "Superintendent, NIT Goa",
  groomParents: "S/o Mr. Sekar & Mrs. Kumari",
  bride: "Deepalakshmi",
  brideTitle: "Physiotherapist, PHC Mangalam",
  brideParents: "D/o Mr. Manivachagam (Superintendent, Thellar) & Mrs. Kalaivani",
  blessing: "With the blessings of our elders and the grace of the Almighty",
  inviteLine: "We request the honour of your gracious presence as we tie the knot",

  // Main ceremony date & time (India time). Format: YYYY-MM-DDTHH:MM:SS+05:30
  dateTime: "2026-12-10T09:00:00+05:30",
  durationHours: 1.5,

  venueName: "Vijaya Ravi Mahal",
  venueAddress: "Ernamangalam, Tamil Nadu 606908",
  mapsLink: "https://www.google.com/maps/search/?api=1&query=Vijaya+Ravi+Mahal+Ernamangalam+Tamil+Nadu+606908",

  // Other functions — add, remove or leave empty []
  events: [
    { name: "Reception", when: "Wednesday, 9 December 2026 · 7:00 PM onwards",   where: "Vijaya Ravi Mahal, Ernamangalam" },
    { name: "Marriage",  when: "Thursday, 10 December 2026 · 9:00 – 10:30 AM",  where: "Vijaya Ravi Mahal, Ernamangalam" }
  ],

  closing: "Your presence and blessings are the greatest gift",
  signoff: "With love, from both our families"

</script>

<style>
:root{
  --plum-900:#241032; --plum-800:#321845; --plum-700:#43225a; --plum-600:#5a3176;
  --mauve:#8d5fa3; --lilac:#c9a3d6; --rose:#e9a6c3; --peach:#f6c79a;
  --gold-1:#f6e2a8; --gold-2:#e2bd72; --gold-3:#b98a3e; --cream:#fbf1dd;
  --script:"Pinyon Script", "Brush Script MT", cursive;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif); color:var(--cream); background:var(--plum-900);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;height:100vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

.gold{
  background:linear-gradient(175deg,var(--gold-1) 10%,var(--gold-2) 45%,var(--gold-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.script{font-family:var(--script);font-weight:400;line-height:1.15}
/* The script font's tails and swashes reach outside the text box; give the gold fill room so they aren't cut off */
.script.gold,h3.gold{padding:.22em .3em .38em;margin:-.22em -.3em -.38em}
.caps{letter-spacing:.28em;text-transform:uppercase;font-weight:500}

/* ---------- Envelope cover ---------- */
#cover{--flap:60%;
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  cursor:pointer;overflow:hidden;background:transparent;border:0;width:100%;
  font:inherit;color:inherit;text-align:center;
}
.flap{
  position:relative;flex:0 0 var(--flap);z-index:2;
  filter:drop-shadow(0 10px 18px rgba(20,5,30,.55));
  transition:transform 1.3s cubic-bezier(.7,0,.2,1) .35s;
}
.flap-edge,.flap-art{
  position:absolute;inset:0;
  clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);
}
.flap-edge{background:linear-gradient(180deg,var(--gold-3),var(--gold-1) 60%,var(--gold-3))}
.flap-art{inset:0 5px 6px 5px;background:var(--plum-700)}
.flap-art img{width:100%;height:100%;object-fit:cover;object-position:46% 6%;display:block}
.flap-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 70%,rgba(50,24,69,.55) 100%)}
.pocket{
  position:relative;flex:1;margin-top:-16vh;padding:calc(16vh + 90px) 20px 24px; /* clears the seal and its tassels */
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(233,166,195,.22),transparent 60%),
    linear-gradient(180deg,var(--plum-600),var(--plum-800));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform 1.3s cubic-bezier(.7,0,.2,1) .35s;
}
.pocket::before{ /* inner gold border */
  content:"";position:absolute;inset:8px;border:1px solid rgba(226,189,114,.55);
  border-top:0;pointer-events:none;
}
.pocket .caps{font-size:clamp(11px,3vw,14px);color:var(--gold-2)}
.pocket .names{font-size:clamp(38px,11vw,64px)}
.tap{
  margin-top:10px;padding:9px 26px;border:1px solid var(--gold-2);border-radius:999px;
  font-family:var(--script);font-size:clamp(20px,5.5vw,26px);color:var(--gold-1);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,226,168,.45)}50%{box-shadow:0 0 0 12px rgba(246,226,168,0)}}

.seal{
  position:absolute;left:50%;top:var(--flap);z-index:3;width:104px;height:104px;
  transform:translate(-50%,-62%);
  transition:transform .6s ease,opacity .6s ease;
}
.seal .wax{
  position:absolute;inset:0;
  border-radius:47% 53% 50% 50% / 52% 46% 54% 48%;
  background:radial-gradient(circle at 35% 30%,#fbe7ae,#d9a94d 45%,#9a6a22 100%);
  box-shadow:0 6px 14px rgba(20,5,30,.6), inset 0 0 0 9px rgba(154,106,34,.35), inset 0 0 0 11px rgba(251,231,174,.5);
  display:grid;place-items:center;color:#7a4f14;
}
.seal .wax{background:radial-gradient(circle,#4a2663 0,#2c133d 57%,transparent 58%),radial-gradient(circle at 35% 30%,#fbe7ae,#d9a94d 45%,#9a6a22 100%)}
.seal .wax img{width:40px;height:auto;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.seal .wax{animation:sealPulse 2.2s ease-in-out infinite}
@keyframes sealPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.seal .tassel{
  position:absolute;top:92%;width:11px;height:34px;border-radius:3px 3px 6px 6px;
  background:repeating-linear-gradient(90deg,#b98a3e 0 2px,#f0cf85 2px 4px);
}
.seal .tassel::before{content:"";position:absolute;left:50%;top:-12px;width:1.5px;height:12px;background:var(--gold-2)}
.seal .tassel.a{left:36%;transform:rotate(8deg)} .seal .tassel.b{left:54%;top:98%;transform:rotate(-6deg)}

@media (max-height:700px){#cover{--flap:52%}}
@media (max-height:560px){#cover{--flap:44%} .pocket{gap:4px} .tap{margin-top:4px;padding:6px 22px}}
/* On wide screens keep the cover a phone-shaped column so the painting isn't cropped */
#cover{align-items:center;background:var(--plum-900)}
#cover .flap,#cover .pocket{width:min(100%,560px)}
#cover.open{background:transparent;transition:background .6s ease .5s}
#cover.open .seal{transform:translate(-50%,-62%) scale(1.5) rotate(18deg);opacity:0}
#cover.open .flap{transform:translateY(-115%)}
#cover.open .pocket{transform:translateY(115%)}
#cover.gone{display:none}

footer .byline{text-align:right;font-size:12px;font-style:italic;letter-spacing:0;color:rgba(201,163,214,.75);margin-top:34px}

/* Crackers overlay shown once the countdown reaches zero */
.crackers{position:fixed;inset:0;width:100%;height:100%;z-index:15;pointer-events:none}
.count.done div{border-color:var(--gold-1);box-shadow:0 0 14px rgba(246,226,168,.35)}

/* Music button */
.mute{
  position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:var(--gold-1);background:rgba(36,16,50,.72);border:1px solid var(--gold-2);
  box-shadow:0 6px 16px rgba(20,5,30,.5);backdrop-filter:blur(6px);
}
.mute[hidden]{display:none}
.mute svg{width:22px;height:22px}
.mute .off{display:none}
.mute.is-off .on{display:none}
.mute.is-off .off{display:block}

/* ---------- Page ---------- */
main{
  position:relative;max-width:560px;margin:0 auto;padding:0 18px 60px;
  text-align:center;
}
.bg{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(70% 40% at 15% 8%,rgba(233,166,195,.35),transparent 70%),
    radial-gradient(60% 35% at 90% 38%,rgba(246,199,154,.20),transparent 70%),
    radial-gradient(80% 45% at 30% 85%,rgba(233,166,195,.25),transparent 70%),
    linear-gradient(180deg,#4a2663 0%,#5b3278 30%,#43225a 65%,#2a1239 100%);
}
#petals{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden} /* part of the page, so it scrolls with it */
.petal{
  position:absolute;display:block;opacity:0;
  filter:drop-shadow(0 2px 4px rgba(36,16,50,.35));
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(var(--tilt));opacity:0}
  12%{opacity:var(--o)}
  50%{transform:translate3d(calc(var(--drift) * .6),calc(var(--fall) * .5),0) rotate(calc(var(--tilt) * -1))}
  82%{opacity:var(--o)}
  100%{transform:translate3d(var(--drift),var(--fall),0) rotate(var(--tilt));opacity:0}
}

section{padding:54px 0 10px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s ease}
.reveal.in{opacity:1;transform:none}

.divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold-2);margin:16px auto}
.divider::before,.divider::after{content:"";height:1px;width:74px;background:linear-gradient(90deg,transparent,var(--gold-2))}
.divider::after{transform:scaleX(-1)}
.divider svg{width:30px;height:18px}

.feather{display:block;width:46px;height:auto;margin:0 auto 6px;filter:drop-shadow(0 2px 6px rgba(36,16,50,.5))}

/* Hero */
.hero{padding-top:18px}
.hero .blessing{font-style:italic;font-size:17px;color:var(--lilac);max-width:300px;margin:0 auto 22px}
:is(.hero,.couple) .names{font-size:clamp(50px,14vw,78px)}
:is(.hero,.couple) .amp{font-family:var(--script);font-size:38px;color:var(--rose);margin:-4px 0}
:is(.hero,.couple) .title{font-size:15px;color:var(--gold-1);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
:is(.hero,.couple) .parents{font-size:16px;color:var(--lilac);margin-top:6px;letter-spacing:.03em}

/* Painted plates: the picture is the page, text sits in its empty panels */
.plate{position:relative;margin:0 -18px;container-type:inline-size}
.plate img{
  display:block;width:100%;height:auto;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 93%,transparent 100%);
}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.plate h2{font-size:10vw;font-size:10.4cqw;line-height:1.05}
.plate p.lead{font-size:3vw;font-size:3.05cqw;line-height:1.85;letter-spacing:.2em;color:var(--gold-1)}

.datebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;color:var(--gold-1)}
.datebar > div{padding:1.8cqw .5cqw}
.datebar .side{font-size:2.9vw;font-size:2.9cqw;letter-spacing:.12em;border-top:1px solid var(--gold-2);border-bottom:1px solid var(--gold-2)}
.datebar .mid{border-left:1px solid var(--gold-2);border-right:1px solid var(--gold-2);padding:0 3cqw}
.datebar .day{font-size:13vw;font-size:13cqw;line-height:1;font-weight:500}
.datebar .my{font-size:2.6vw;font-size:2.6cqw;letter-spacing:.12em;margin-top:.6cqw}

.slot.row{align-items:flex-start;text-align:left}
.slot.row h3{font-family:var(--script);font-weight:400;font-size:8vw;font-size:8.2cqw;line-height:1.1}
.slot.row p{font-size:3.5vw;font-size:3.5cqw;line-height:1.35;color:var(--cream)}
.slot.row small{font-size:3.1vw;font-size:3.1cqw;line-height:1.3;color:var(--lilac);font-style:italic;margin-top:.6cqw}

/* Countdown */
.count{display:flex;justify-content:center;gap:10px;margin-top:-6px;position:relative}
.count div{
  min-width:66px;padding:12px 4px 10px;border:1px solid rgba(226,189,114,.6);border-radius:12px;
  background:rgba(36,16,50,.45);backdrop-filter:blur(4px);
}
.count b{display:block;font-size:30px;font-weight:500;color:var(--gold-1);font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--lilac)}

/* Events */
.events{display:grid;gap:14px;margin-top:6px}
.event{
  padding:20px 16px;border-radius:14px;border:1px solid rgba(226,189,114,.5);
  background:linear-gradient(180deg,rgba(67,34,90,.7),rgba(36,16,50,.7));
}
.event h3{font-family:var(--script);font-weight:400;font-size:36px}
.event p{font-size:17px;color:var(--cream);margin-top:4px}
.event small{font-size:15px;color:var(--lilac);font-style:italic}

.maplink{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;
  text-decoration-color:rgba(226,189,114,.75);cursor:pointer;-webkit-tap-highlight-color:rgba(246,226,168,.25)}

/* Venue */
.venue-name{font-size:clamp(26px,7.5vw,34px);font-weight:500;line-height:1.2;margin-top:12px}
.venue-addr{font-style:italic;font-size:18px;color:var(--lilac);margin-top:6px}
.palace{width:210px;margin:10px auto 0;color:var(--gold-2)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;
  font-family:var(--serif);font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  text-decoration:none;color:var(--plum-900);
  background:linear-gradient(175deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 16px rgba(20,5,30,.4);
}
.btn.ghost{background:none;color:var(--gold-1);border:1px solid var(--gold-2);box-shadow:none}
.btn svg{width:16px;height:16px}

/* Paintings melt into the page: no frame, soft faded edges, text overlaps them */
.art{
  display:block;width:calc(100% + 36px);max-width:none;height:auto;margin:0 -18px;
  position:relative;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 66%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 66%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);
  mask-composite:intersect;
}
.art ~ *{position:relative;z-index:1}
.art-details{margin-top:-6px;margin-bottom:-110px}
/* Starting page: compact, so more of the painting shows on the first screen */
.hero .feather{width:32px;margin-bottom:4px}
.hero .blessing{font-size:14px;max-width:260px;margin-bottom:14px}
.hero .names{font-size:clamp(34px,10vw,50px)}
.hero .amp{font-size:24px;margin:-8px 0}
/* The groom/bride arch and the ceremony arch stack directly, like two storeys, with no gap */
.couple{padding-bottom:0}
.couple + section{padding-top:0}
.plate-couple img{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5%);mask-image:linear-gradient(to bottom,transparent 0,#000 5%)}
.plate-ceremony img{-webkit-mask-image:linear-gradient(to bottom,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,#000 93%,transparent 100%)}
/* Groom and bride page, written inside the painted arch */
.plate-couple .who{font-size:2.6vw;font-size:2.6cqw;color:var(--lilac);margin-bottom:.4cqw}
.plate-couple .names{font-size:12.5vw;font-size:12.5cqw}
.plate-couple .title{font-size:3.2vw;font-size:3.2cqw;letter-spacing:.08em;margin-top:.6cqw}
.plate-couple .parents{font-size:3.9vw;font-size:3.9cqw;line-height:1.35;margin-top:1.2cqw;letter-spacing:.02em}
.plate-couple .amp{font-size:8vw;font-size:8cqw;margin:2.5cqw 0 1.5cqw}
.art-venue{margin-top:-56px;margin-bottom:-120px}
.hero{padding-bottom:0}
.hero .parents,.venue-addr{text-shadow:0 1px 8px rgba(36,16,50,.9)}
.venue-name{filter:drop-shadow(0 2px 6px rgba(36,16,50,.9))}

footer{padding:50px 0 20px}
footer .script{font-size:clamp(34px,9.5vw,46px)}
footer p{font-size:17px;color:var(--lilac);font-style:italic;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  .petal,.tap,.seal .wax{animation:none} .petal{display:none}
  .reveal{opacity:1;transform:none;transition:none}
  .flap,.pocket,.seal{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>

<body class="locked">

</svg>

<!-- ===== Envelope cover ===== -->
<button id="cover" aria-label="Open the invitation">
  <div class="flap">
    <div class="flap-edge"></div>
    <div class="flap-art">
      <img src="images/cover.jpg" alt="Krishna playing the flute with Radha resting on his shoulder, beside a lotus lake">
    </div>
  </div>

  <div class="seal" aria-hidden="true">
    <span class="tassel a"></span><span class="tassel b"></span>
    <div class="wax"><img src="images/feather.png" alt=""></div>
  </div>

  <div class="pocket">
    <div class="caps">The Wedding of</div>
    <div class="script names gold"><span data-f="groom"></span> &amp; <span data-f="bride"></span></div>
    <div class="tap">Tap to open</div>
  </div>
</button>

<div class="bg"></div>

<audio id="song" src="song.m4a" loop preload="auto"></audio>
<button id="mute" class="mute" hidden aria-label="Turn music off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z" fill="currentColor"/>
    <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>
    <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<main>
  <!-- Hero -->
  <section class="hero reveal">
    <img class="feather" src="images/feather.png" alt="">
    <p class="blessing" data-f="blessing"></p>
    <h1>
      <span class="sr">The wedding of </span>
      <div class="script names gold" data-f="groom"></div>
      <div class="amp" aria-hidden="true">&amp;</div><span class="sr"> and </span>
      <div class="script names gold" data-f="bride"></div>
    </h1>
    <img class="art art-details" src="images/details.jpg" loading="lazy" alt="Radha and Krishna hand in hand, wearing flower garlands">
  </section>

  <!-- The couple: names again, with designation and parents -->
  <section class="couple reveal">
    <div class="plate plate-couple">
      <img src="images/arch.jpg" loading="lazy" alt="">
      <div class="slot" style="top:21%;height:68%;left:14%;right:14%">
        <div class="person">
          <div class="who caps">The Groom</div>
          <div class="script names gold" data-f="groom"></div>
          <div class="title" data-f="groomTitle"></div>
          <div class="parents" data-f="groomParents"></div>
        </div>
        <div class="amp" aria-hidden="true">&amp;</div>
        <div class="person">
          <div class="who caps">The Bride</div>
          <div class="script names gold" data-f="bride"></div>
          <div class="title" data-f="brideTitle"></div>
          <div class="parents" data-f="brideParents"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Ceremony -->
  <section class="reveal">
    <div class="plate plate-ceremony">
      <img src="images/ceremony.jpg" loading="lazy" alt="">
      <div class="slot" style="top:25%;height:22%;left:21%;right:20%">
        <h2 class="script gold">The Wedding Ceremony</h2>
      </div>
      <div class="slot" style="top:48.6%;height:20%;left:21%;right:20%">
        <p class="lead caps" data-f="inviteLine"></p>
      </div>
      <div class="slot" style="top:70.2%;height:20%;left:18%;right:16%">
        <div class="datebar">
          <div class="side caps" id="dWeekday"></div>
          <div class="mid"><div class="day" id="dDay"></div><div class="my caps" id="dMonthYear"></div></div>
          <div class="side caps" id="dTime"></div>
        </div>

    </div>
    <div class="count" id="count" aria-live="off">
      <div><b id="cD">0</b><span>Days</span></div>
      <div><b id="cH">0</b><span>Hours</span></div>
      <div><b id="cM">0</b><span>Mins</span></div>
      <div><b id="cS">0</b><span>Secs</span></div>
    </div>

  <!-- Events -->
  <section class="reveal" id="eventsSection">
    <div class="plate plate-events">
      <img src="images/celebrations.jpg" loading="lazy" alt="">
      <div class="slot" style="top:5.5%;height:13%;left:20%;right:20%">
        <h2 class="script gold">Celebrations</h2>
      </div>
      <div class="slot row" id="ev0" style="top:19.6%;height:17%;left:45%;right:8%"></div>
      <div class="slot row" id="ev1" style="top:37.4%;height:18.2%;left:45%;right:8%"></div>
    </div>
    <div class="events" id="events"></div>
  </section>

  <!-- Venue -->
  <section class="reveal">
    <img class="feather" src="images/feather.png" alt="">
    <h2 class="script gold" style="font-size:clamp(40px,11.5vw,56px)">Venue &amp; Location</h2>
    <div class="divider"><svg aria-hidden="true"><use href="#lotus-line"/></svg></div>
    <img class="art art-venue" src="images/venue.jpg" loading="lazy" alt="Radha and Krishna seated under a flower-decked wedding mandap by a lotus lake">
    <div class="venue-name gold" data-f="venueName"></div>
    <div class="venue-addr" data-f="venueAddress"></div>
    <div class="btns">
      <a class="btn" id="mapBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
        Open in Maps
      </a>
      <a class="btn ghost" id="calBtn" target="_blank" rel="noopener">Add to Calendar</a>
    </div>
  </section>

  <footer class="reveal">
    <div class="divider"><svg aria-hidden="true"><use href="#lotus-line"/></svg></div>
    <div class="script gold" data-f="closing"></div>
    <p data-f="signoff"></p>
    <p class="byline">By Bharathraj</p>
  </footer>
  <div id="petals" aria-hidden="true"></div>
</main>

<script>
(function(){
  const W = WEDDING, $ = id => document.getElementById(id);

  // Fill text
  document.querySelectorAll("[data-f]").forEach(el => {
    const v = W[el.dataset.f];
    if (v) el.textContent = v; else el.remove();
  });
  document.title = `${W.groom} & ${W.bride} — Wedding Invitation`;

  // Date
  const when = new Date(W.dateTime);
  const fmt = o => new Intl.DateTimeFormat("en-IN", Object.assign({ timeZone: "Asia/Kolkata" }, o)).format(when);
  $("dWeekday").textContent = fmt({ weekday: "long" });
  $("dDay").textContent = fmt({ day: "numeric" });
  $("dMonthYear").textContent = fmt({ month: "long" }) + " " + fmt({ year: "numeric" });
  $("dTime").textContent = fmt({ hour: "numeric", minute: "2-digit", hour12: true }).toUpperCase();

  // Crackers: once the countdown reaches zero, fireworks burst over the page
  let celebrated = false, coverOpen = false, wantCrackers = false;
  // Preview it any time by adding ?celebrate to the end of the link
  const target = /[?&]celebrate(&|=|$)/.test(location.search) ? new Date(Date.now() - 1000) : when;
  function celebrate(){
    $("count").classList.add("done");
    if (coverOpen) crackers(16000); else wantCrackers = true;   // wait for the envelope to be opened
  }
  function crackers(duration){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.className = "crackers"; c.setAttribute("aria-hidden", "true");
    document.body.append(c);
    const ctx = c.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0, H = 0;
    const size = () => { W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); addEventListener("resize", size);
    const colours = ["#f6e2a8", "#ffd166", "#ff9ec4", "#ffffff", "#c9a3d6", "#ffb347", "#7fe3d4"];
    const sparks = [], start = performance.now(); let nextBurst = 0;
    function burst(){
      const x = W * (.15 + Math.random() * .7), y = H * (.12 + Math.random() * .45);
      const col = colours[Math.floor(Math.random() * colours.length)], n = 46 + Math.floor(Math.random() * 30);
      const power = 2.4 + Math.random() * 2.6;
      for (let i = 0; i < n; i++) {
        const a = Math.PI * 2 * i / n + Math.random() * .2, v = power * (.55 + Math.random() * .6);
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, fade: .010 + Math.random() * .012,
                      col: Math.random() < .2 ? "#ffffff" : col, r: 1.2 + Math.random() * 1.4 });
      }
    }
    function frame(now){
      const t = now - start;
      if (t < duration && t >= nextBurst) { burst(); if (Math.random() < .35) burst(); nextBurst = t + 380 + Math.random() * 520; }
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.vx *= .985; p.vy = p.vy * .985 + .045; p.x += p.vx; p.y += p.vy; p.life -= p.fade;
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        ctx.globalAlpha = Math.max(p.life, 0) * .35;                 // short glowing tail
        ctx.beginPath(); ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, p.r * .8, 0, 6.283); ctx.fill();
      }
      if (t < duration || sparks.length) requestAnimationFrame(frame);
      else { removeEventListener("resize", size); c.remove(); }
    }
    requestAnimationFrame(frame);
  }

  // Countdown
  function tick(){
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    if (s === 0 && !celebrated) { celebrated = true; celebrate(); }
    $("cD").textContent = Math.floor(s / 86400); s %= 86400;
    $("cH").textContent = Math.floor(s / 3600);  s %= 3600;
    $("cM").textContent = Math.floor(s / 60);
    $("cS").textContent = s % 60;
  }
  tick(); setInterval(tick, 1000);

  // Every mention of the venue opens it in Google Maps
  function mapLink(text){
    const a = document.createElement("a");
    a.href = W.mapsLink; a.target = "_blank"; a.rel = "noopener"; a.className = "maplink";
    a.textContent = text; a.setAttribute("aria-label", text + " — open in Google Maps");
    return a;
  }
  document.querySelectorAll('[data-f="venueName"],[data-f="venueAddress"]').forEach(el => {
    const t = el.textContent; el.textContent = ""; el.append(mapLink(t));
  });

  // Events: the first two sit in the painted rows, any extra ones list below
  if (W.events && W.events.length) {
    W.events.forEach((e, i) => {
      const slot = $("ev" + i);
      const d = slot || document.createElement("div"); if (!slot) d.className = "event";
      const h = document.createElement("h3"); h.className = "gold"; h.textContent = e.name;
      d.append(h);
      e.when.split(" · ").forEach(line => { const p = document.createElement("p"); p.textContent = line; d.append(p); });
      const sm = document.createElement("small"); if (e.where) sm.append(mapLink(e.where)); d.append(sm);
      if (!slot) $("events").append(d);
    });
  } else $("eventsSection").remove();

  // Links
  $("mapBtn").href = W.mapsLink;
  const z = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
  const end = new Date(when.getTime() + (W.durationHours || 3) * 3600e3);
  $("calBtn").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(`${W.groom} & ${W.bride} — Wedding`)
    + "&dates=" + z(when) + "/" + z(end)
    + "&location=" + encodeURIComponent(`${W.venueName}, ${W.venueAddress}`);

  // Petals
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) for (let i = 0; i < 42; i++) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "svg"); p.setAttribute("class", "petal");
    p.setAttribute("viewBox", "0 0 100 62");
    p.innerHTML = '<use href="#lotus"/>';
    const size = 18 + Math.random() * 18;
    p.style.cssText = `left:${Math.random()*94}%;top:${(Math.random()*96-2).toFixed(1)}%;width:${size}px;height:${size*.62}px;`
      + `--drift:${(Math.random()*100-50).toFixed(0)}px;--tilt:${(Math.random()*40-20).toFixed(0)}deg;`
      + `animation-duration:${11+Math.random()*10}s;animation-delay:${-Math.random()*20}s;`
      + `--fall:${(420+Math.random()*320).toFixed(0)}px;--o:${(.55+Math.random()*.4).toFixed(2)}`;
    $("petals").append(p);
  }

  // Reveal on scroll
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: .15 });

  // Open the envelope
  if ("scrollRestoration" in history) history.scrollRestoration = "manual"; // don't reopen halfway down
  window.scrollTo(0, 0);
  // Music
  const song = $("song"), mute = $("mute");
  let muted = false;
  function setMuted(m){
    muted = m; mute.classList.toggle("is-off", m);
    mute.setAttribute("aria-label", m ? "Turn music on" : "Turn music off");
    if (m) song.pause(); else song.play().catch(() => {});
  }
  mute.addEventListener("click", () => setMuted(!muted));
  // Loop forever: the loop attribute does this, and this restarts it on browsers that ignore it
  song.addEventListener("ended", () => { song.currentTime = 0; if (!muted) song.play().catch(() => {}); });
  document.addEventListener("visibilitychange", () => {
    if (mute.hidden || muted) return;
    if (document.hidden) song.pause(); else song.play().catch(() => {});
  });

  const cover = $("cover");
  cover.addEventListener("click", () => {
    if (cover.classList.contains("open")) return;
    window.scrollTo({ top: 0, left: 0, behavior: "instant" }); // always start from the top
    cover.classList.add("open");
    song.volume = .8; song.play().catch(() => setMuted(true)); // music starts with the guest's tap
    mute.hidden = false;
    document.body.classList.remove("locked");
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    setTimeout(() => cover.classList.add("gone"), reduce ? 50 : 1800);
    coverOpen = true;
    if (wantCrackers) { wantCrackers = false; setTimeout(() => crackers(16000), 1600); }
  });
})();
</script>
</body>
</html>
